<nav class="bottom-nav" [attr.aria-label]="i18n.t('nav.ariaPrimary')">
  <div class="bottom-nav__bar">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bottom-nav__item--active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="bottom-nav__item"
        [attr.aria-label]="i18n.t(item.labelKey)"
      >
        <span class="material-symbols-outlined bottom-nav__icon" aria-hidden="true">{{ item.icon }}</span>
      </a>
    }
  </div>
</nav>
