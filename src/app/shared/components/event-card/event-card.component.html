<div class="event-card">
  <button
    type="button"
    class="event-card__image-wrapper"
    [class.event-card__image-wrapper--default]="!hasCustomImage"
    [style.aspect-ratio]="imageAspectRatio"
    [attr.aria-label]="event.title"
    (click)="imageClick.emit()"
  >
    <img
      [src]="event.imageUrl"
      [alt]="event.title"
      class="event-card__image"
      loading="lazy"
      [width]="event.imageWidth ?? 1080"
      [height]="event.imageHeight ?? 1920"
    />
    @if (!hideMeta) {
      <span class="event-card__date-badge" aria-hidden="true">
        <span class="event-card__date-month">{{ monthLabel(event.date) }}</span>
        <span class="event-card__date-day">{{ dayLabel(event.date) }}</span>
      </span>
    }
  </button>

  @if (!hideMeta) {
    <div class="event-card__body">
      <div class="event-card__tags">
        @for (tag of event.tags; track tag) {
          <span [class]="tagClass(tag)">{{ translateTag(tag) }}</span>
        }
      </div>

      <h3 class="event-card__title">{{ event.title }}</h3>

      <div class="event-card__meta">
        <div class="event-card__meta-item">
          <span class="material-symbols-outlined">schedule</span>
          {{ event.time }}h · {{ event.location }}
        </div>
        @if (event.distance) {
          <div class="event-card__meta-item">
            <span class="material-symbols-outlined">distance</span>
            {{ event.distance }}{{ event.elevationGain ? ' · ' + event.elevationGain : '' }}
          </div>
        }
      </div>
    </div>
  }
</div>
